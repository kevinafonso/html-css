<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner {  /*
                            MUITO IMPORTANTE!!!

                            Padrão de direção que ja vem no flex (flex-direction:row;)
                            existe o (flex-direction: row-reverse;) que os items vão da direita p/ a esquerda
                            existe a posição vertical (flex-direction: column;)
                            existe a vertical de baixo p/ cima (flex-ditection: column-reverse;)
                            
                            na horizontal o inicio é chamado de main-start e o fim main-end
                            na vertical o inicio é chamado de cross-start e o fim cross-end

                            */

            background-color: lightsalmon;

            display: flex;
            flex-flow: row wrap;
            align-content: space-evenly;
            height: 400px;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
        <div class="item">K</div>
        <div class="item">L</div>
    </div>
</body>
</html>
