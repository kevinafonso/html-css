<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content=""width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner {  /*
                            MUITO IMPORTANTE!!!

                            Padrão de direção que ja vem no flex (flex-direction:row;)
                            existe o (flex-direction: row-reverse;) que os items vão da direita p/ a esquerda
                            existe a posição vertical (flex-direction: column;)
                            existe a vertical de baixo p/ cima (flex-ditection: column-reverse;)
                            
                            na horizontal o inicio é chamado de main-start e o fim main-end
                            na vertical o inicio é chamado de cross-start e o fim cross-end

                            */

            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
        }

       div#cxA {
            /*flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;*/

            flex: 1 0 200px;
       } 
       
       div#cxB {
            /*flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px;*/

            flex: 1 1 150px;
       } 
       
       div#cxC {
            /*flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto;*/

            flex: 1 8 auto;
       } 

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
